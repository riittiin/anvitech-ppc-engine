<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in — Anvitech PPC Engine</title>
  <!-- Self-contained: inline CSS, no JavaScript (keeps CSP script-src strict). -->
  <style>
    :root {
      --bg: #0f1115; --panel: #1a1d24; --border: #2c313b; --text: #e6e8ec;
      --muted: #8b919c; --accent: #4f9cf9; --bad: #f85149;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center;
      justify-content: center; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
    }
    .card {
      width: 100%; max-width: 360px; background: var(--panel);
      border: 1px solid var(--border); border-radius: 10px; padding: 28px 26px;
      box-shadow: 0 8px 30px rgba(0,0,0,.4);
    }
    h1 { margin: 0 0 4px; font-size: 20px; }
    .sub { margin: 0 0 20px; color: var(--muted); font-size: 13px; }
    label { display: block; margin: 14px 0 6px; color: var(--muted); font-size: 13px; }
    input {
      width: 100%; padding: 10px 12px; background: #0f1218; color: var(--text);
      border: 1px solid var(--border); border-radius: 6px; font-size: 14px;
    }
    input:focus { outline: none; border-color: var(--accent); }
    button {
      width: 100%; margin-top: 20px; padding: 11px; border: 0; border-radius: 6px;
      background: var(--accent); color: #06223f; font-weight: 600; font-size: 14px;
      cursor: pointer;
    }
    button:hover { filter: brightness(1.05); }
    .err {
      margin-top: 16px; padding: 10px 12px; border-radius: 6px; font-size: 13px;
      background: rgba(248,81,73,.12); border: 1px solid var(--bad); color: #ff9a92;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Anvitech PPC Engine</h1>
    <p class="sub">Please sign in to continue.</p>
    <form method="post" action="/login" autocomplete="off">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" required autofocus />
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required />
      <button type="submit">Sign in</button>
    </form>
    <!--ERROR-->
  </main>
</body>
</html>
