<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in: Anvitech PPC Engine</title>
  <!-- Self-contained: inline CSS, no JavaScript (keeps CSP script-src strict). -->
  <style>
    :root {
      --paper: #0e1116; --card: #171b21; --line: #262c33; --ink: #e6e8eb;
      --muted: #9aa3ad; --accent: #3b82f6; --danger: #f85149;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center;
      justify-content: center; background: var(--paper); color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 15px;
    }
    .card {
      width: 100%; max-width: 360px; background: var(--card);
      border: 1px solid var(--line); border-radius: 10px; padding: 28px 26px;
      box-shadow: 0 4px 20px rgba(0,0,0,.35);
    }
    .brand-logo { height: 44px; width: auto; display: block; color: var(--ink); margin: 0 0 16px; }
    h1 { margin: 0 0 4px; font-size: 20px; }
    .sub { margin: 0 0 20px; color: var(--muted); font-size: 13px; }
    label { display: block; margin: 14px 0 6px; color: var(--muted); font-size: 13px; }
    input {
      width: 100%; padding: 10px 12px; background: var(--paper); color: var(--ink);
      border: 1px solid var(--line); border-radius: 6px; font-size: 14px;
    }
    input:focus { outline: none; border-color: var(--accent); }
    button {
      width: 100%; margin-top: 20px; padding: 11px; border: 0; border-radius: 6px;
      background: var(--accent); color: #fff; font-weight: 600; font-size: 14px;
      cursor: pointer;
    }
    button:hover { filter: brightness(1.05); }
    .err {
      margin-top: 16px; padding: 10px 12px; border-radius: 6px; font-size: 13px;
      background: rgba(248,81,73,.12); border: 1px solid var(--danger); color: #ffb4ab;
    }
  </style>
</head>
<body>
  <main class="card">
    <svg class="brand-logo" viewBox="0 0 220 132" role="img" aria-label="Anvitech logo" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="anv-a" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#4f86ff"/><stop offset="1" stop-color="#1b2f97"/>
        </linearGradient>
        <linearGradient id="anv-wing" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#8fb0f2"/><stop offset="1" stop-color="#5a86e6"/>
        </linearGradient>
      </defs>
      <ellipse cx="110" cy="66" rx="99" ry="57" fill="none" stroke="currentColor" stroke-width="13"/>
      <g fill="url(#anv-wing)">
        <rect x="34" y="42" width="87" height="7" rx="3.5"/>
        <rect x="44" y="54" width="72" height="7" rx="3.5"/>
        <rect x="54" y="66" width="57" height="7" rx="3.5"/>
        <rect x="64" y="78" width="42" height="7" rx="3.5"/>
        <rect x="74" y="90" width="27" height="7" rx="3.5"/>
      </g>
      <path d="M126 30 96 102 M126 30 156 102" fill="none" stroke="url(#anv-a)"
            stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h1>Anvitech PPC Engine</h1>
    <p class="sub">Please sign in to continue.</p>
    <form method="post" action="/login" autocomplete="off">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" required autofocus />
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required />
      <button type="submit">Sign in</button>
    </form>
    <!--ERROR-->
  </main>
</body>
</html>
