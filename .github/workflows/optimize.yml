# Cloud Optimize — the app (Render) dispatches this workflow when the admin
# presses Start; the runner computes the full fair contest (~2,400 plans) and
# posts the result back. See scripts/cloud_optimize_worker.py and the spec
# docs/superpowers/specs/2026-07-15-optimize-settings-sweep-design.md.
#
# Repo secrets required: APP_URL, OPTIMIZE_WORKER_SECRET (must equal the
# Render env var of the same name).
name: optimize

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "The app's job id for this optimization run"
        required: true
        type: string

concurrency: optimize   # one contest at a time — matches the app's own lock

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run the contest and post the result back
        env:
          APP_URL: ${{ secrets.APP_URL }}
          OPTIMIZE_WORKER_SECRET: ${{ secrets.OPTIMIZE_WORKER_SECRET }}
          JOB_ID: ${{ inputs.job_id }}
        run: python scripts/cloud_optimize_worker.py
